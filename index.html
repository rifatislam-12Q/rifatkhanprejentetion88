    <!-- Production CSS for direct GitHub Pages static hosting -->
    <link rel="stylesheet" href="./assets/index.css" onerror="this.onerror=null;this.href='./docs/assets/index.css';" />
  </head>
  <body class="bg-[#090d16] text-slate-100 antialiased selection:bg-indigo-500/30 selection:text-indigo-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      // GitHub Pages static hosting fallback: if /src/main.tsx cannot run, load the compiled bundle
      setTimeout(() => {
        const root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 0)) {
          const script = document.createElement('script');
          script.type = 'module';
          script.crossOrigin = 'anonymous';
          script.src = './assets/index.js';
          script.onerror = () => {
            const fallbackScript = document.createElement('script');
            fallbackScript.type = 'module';
            fallbackScript.crossOrigin = 'anonymous';
            fallbackScript.src = './docs/assets/index.js';
            document.body.appendChild(fallbackScript);
          };
          document.body.appendChild(script);
        }
      }, 250);
    </script>
  </body>
</html>
